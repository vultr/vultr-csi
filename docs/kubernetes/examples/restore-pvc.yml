apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: csi-restored-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: vultr-block-storage
  resources:
    requests:
      storage: 10Gi
  dataSource:
    name: csi-snapshot
    kind: VolumeSnapshot
    apiGroup: snapshot.storage.k8s.io
