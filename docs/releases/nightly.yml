### Storage Classes
####################
apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: block.csi.vultr.com
spec:
  attachRequired: true
  podInfoOnMount: true

---
kind: StorageClass
apiVersion: storage.k8s.io/v1
